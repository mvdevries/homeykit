name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Versie bepalen
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changelog: ${{ steps.changelog.outputs.text }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Controleer of er een basisversie is
        run: |
          if ! git tag --list 'v*' | grep -q .; then
            echo "Er is nog geen tag v<versie>. Zet eenmalig de tag van de laatst uitgebrachte versie, bijvoorbeeld: git tag v0.1.5 <commit> && git push origin v0.1.5" >&2
            exit 1
          fi
      - name: Versie uit de branchnaam van de gemergede PR
        id: version
        uses: paulhatch/semantic-version@v6.0.7
        with:
          tag_prefix: "v"
          major_pattern: "/Merge pull request #\\d+ from [^/]+\\/breaking\\//"
          minor_pattern: "/Merge pull request #\\d+ from [^/]+\\/feature\\//"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
      - name: Changelogtekst uit de titel van de PR
        id: changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].title // empty')
          if [ -z "$title" ]; then
            title=$(git log -1 --format=%s)
          fi
          echo "text=$title" >> "$GITHUB_OUTPUT"
          echo "Versie ${{ steps.version.outputs.version }}: $title" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Controles
    uses: ./.github/workflows/checks.yml

  publish:
    name: Uploaden naar Athom
    needs: [version, checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Versie en changelog invullen
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
        run: |
          for manifest in .homeycompose/app.json app.json; do
            if [ -f "$manifest" ]; then
              jq --arg version "$VERSION" '.version = $version' "$manifest" > manifest.tmp
              mv manifest.tmp "$manifest"
            fi
          done
          jq --arg version "$VERSION" --arg text "$CHANGELOG" \
            '.[$version] = {en: $text, nl: $text}' .homeychangelog.json > changelog.tmp
          mv changelog.tmp .homeychangelog.json
      - uses: athombv/github-action-homey-app-validate@v1
        with:
          level: publish
      - name: Uploaden
        id: publish
        uses: athombv/github-action-homey-app-publish@v1
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}
      - name: Tag en release aanmaken
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
          UPLOAD_URL: ${{ steps.publish.outputs.url }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "$CHANGELOG"$'\n\n'"Build: $UPLOAD_URL"
          echo "Versie $VERSION geüpload: $UPLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
