name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"
      - ".claude/**"
      - "tests/**"
      - "**.md"
      - "LICENSE"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      previous: ${{ steps.next.outputs.current-v-version }}
      changelog: ${{ steps.pull-request.outputs.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Find the merged pull request
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pull_request=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0] // {}')
          title=$(jq -r '.title // empty' <<< "$pull_request")
          branch=$(jq -r '.head.ref // empty' <<< "$pull_request")
          if [ -z "$title" ]; then
            title=$(git log -1 --format=%s)
          fi
          case "$branch" in
            breaking/*) increment="major" ;;
            feature/*) increment="minor" ;;
            *) increment="patch" ;;
          esac
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "increment=$increment" >> "$GITHUB_OUTPUT"
          echo "Branch '$branch' gives a $increment version." >> "$GITHUB_STEP_SUMMARY"
      - name: Calculate the next version
        id: next
        uses: reecetech/version-increment@2026.8.4
        with:
          scheme: semver
          increment: ${{ steps.pull-request.outputs.increment }}
      - name: Summary
        env:
          VERSION: ${{ steps.next.outputs.version }}
          TITLE: ${{ steps.pull-request.outputs.title }}
        run: |
          echo "Version $VERSION: $TITLE" >> "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
      pull-requests: write

  publish:
    name: Upload to Athom
    needs: [version, checks]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fill in the version and changelog
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
        run: |
          for manifest in .homeycompose/app.json app.json; do
            if [ -f "$manifest" ]; then
              jq --arg version "$VERSION" '.version = $version' "$manifest" > manifest.tmp
              mv manifest.tmp "$manifest"
            fi
          done
          jq --arg version "$VERSION" --arg text "$CHANGELOG" \
            '.[$version] = {en: $text, nl: $text}' .homeychangelog.json > changelog.tmp
          mv changelog.tmp .homeychangelog.json
      - name: Validate the app
        env:
          HOMEY_HEADLESS: "1"
        run: npx --yes homey app validate --level publish
      - name: Upload
        id: publish
        env:
          HOMEY_HEADLESS: "1"
          HOMEY_PAT: ${{ secrets.HOMEY_PAT }}
        run: |
          npx --yes homey app publish
          echo "url=https://tools.developer.homey.app/apps/app/$(jq --raw-output .id app.json)" >> "$GITHUB_OUTPUT"
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          CHANGELOG: ${{ needs.version.outputs.changelog }}
          PREVIOUS_TAG: ${{ needs.version.outputs.previous }}
          UPLOAD_URL: ${{ steps.publish.outputs.url }}
        run: |
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --generate-notes --notes-start-tag "$PREVIOUS_TAG" \
            --notes "$CHANGELOG"$'\n\n'"Build: $UPLOAD_URL"
          echo "Version $VERSION uploaded: $UPLOAD_URL" >> "$GITHUB_STEP_SUMMARY"
