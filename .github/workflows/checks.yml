name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Unit and integration tests
        run: uv run pytest tests/unit tests/integration --cov --cov-report=
      - name: Install Playwright
        run: uv run playwright install --with-deps chromium
      - name: End-to-end tests
        run: uv run pytest tests/e2e --cov --cov-append --cov-report=
      - name: Coverage report
        run: |
          uv run coverage xml
          uv run coverage report --format=markdown --fail-under=90 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Coverage comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: orgoro/coverage@v3.3.1
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.9
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: athombv/github-action-homey-app-validate@v1
        with:
          level: publish
