name: Publiceren

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Uploaden naar Athom
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: athombv/github-action-homey-app-validate@v1
        with:
          level: publish
      - uses: athombv/github-action-homey-app-publish@v1
        id: publish
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}
      - name: Toon de uploadlink
        run: echo "${{ steps.publish.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
