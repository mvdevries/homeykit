[project]
name = "homeykit"
version = "0.1.5"
requires-python = ">=3.14"
dependencies = [
    "HAP-python>=5.2.0",
    "base36>=0.1.1",
    "segno>=1.6.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["python_packages", ".homeybuild", ".python_cache"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "PL",
    "RUF",
    "ERA",
    "T20",
    "ASYNC",
]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 7
max-returns = 5
max-branches = 8
max-statements = 25

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
