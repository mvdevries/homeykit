[project]
name = "homeykit"
version = "0.1.6"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "HAP-python>=5.2.0",
    "base36>=0.1.1",
    "segno>=1.6.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=6.0.0",
    "pytest-playwright>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["python_packages", ".homeybuild", ".python_cache"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "PL",
    "RUF",
    "ERA",
    "T20",
    "ASYNC",
]
ignore = ["PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0911", "PLR0913", "ASYNC109", "PLR0915"]

[tool.ruff.lint.pylint]
max-args = 7
max-returns = 5
max-branches = 8
max-statements = 25

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests with the real HomeKit bridge on loopback",
    "e2e: browser tests of the settings pages",
]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "tests/*",
    "python_packages/*",
    ".venv/*",
    ".homeybuild/*",
    ".python_cache/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
skip_empty = true
